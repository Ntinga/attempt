name: .NET Build and Test

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore RaceDay.sln

      - name: Build Solution
        run: dotnet build RaceDay.sln --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test RaceDay.sln --configuration Release --no-build --verbosity normal

      - name: Verify MVC Project
        run: dotnet build ./RaceDay.MVC/RaceDay.MVC.csproj --configuration Release --no-restore

      - name: Verify API Project
        run: dotnet build ./src/RaceDay.API/RaceDay.API.csproj --configuration Release --no-restore